<app-sidebar></app-sidebar>

<div class="transactions-page">

  <!-- TOPBAR -->

  <div class="topbar">

    <div>

      <h1>Transactions</h1>

      <p>
        Manage your financial transactions
      </p>

    </div>

    <button
      class="add-button"
      (click)="showModal = true"
    >

      <i class="bi bi-plus-lg"></i>

      Add Transaction

    </button>

  </div>

    <div class="filters-section">

        <!-- SEARCH -->

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input

            type="text"

            placeholder="Search transactions..."

            [(ngModel)]="searchText"

            >

        </div>

        <!-- FILTER -->

        <select

            [(ngModel)]="filterType"

        >

            <option value="All">

            All

            </option>

            <option value="Income">

            Income

            </option>

            <option value="Expense">

            Expense

            </option>

        </select>

    </div>

  <!-- TABLE -->

  <div class="table-container">

    <table>

      <thead>

        <tr>

          <th>Title</th>
          <th>Category</th>
          <th>Type</th>
          <th>Amount</th>
          <th>Actions</th>

        </tr>

      </thead>

      <tbody>

        <tr *ngFor="let transaction of filteredTransactions">

          <td>{{ transaction.title }}</td>

          <td>{{ transaction.category }}</td>

          <td>

            <span
              class="type"
              [class.income]="
                transaction.type === 'Income'
              "
              [class.expense]="
                transaction.type === 'Expense'
              "
            >

              {{ transaction.type }}

            </span>

          </td>

          <td>

            <span
              [class.income-text]="
                transaction.type === 'Income'
              "

              [class.expense-text]="
                transaction.type === 'Expense'
              "
            >

              AOA {{ transaction.amount }}

            </span>

          </td>

          <td>

            <button
                class="edit-button"
                (click)="editTransaction(transaction)"
            >

                <i class="bi bi-pencil"></i>

            </button>

            <button
                class="delete-button"
                (click)="deleteTransaction(transaction.id)"
            >

                <i class="bi bi-trash"></i>

            </button>

            </td>

        </tr>

      </tbody>

    </table>

  </div>

  <!-- MODAL -->

  <div
    class="modal-overlay"
    *ngIf="showModal"
  >

    <div class="modal">

      <div class="modal-header">

        <h2>Add Transaction</h2>

        <button
          class="close-button"
          (click)="showModal = false"
        >
          ✕
        </button>

      </div>

      <form (ngSubmit)="addTransaction()">

        <label>Title</label>

        <input
            type="text"

            placeholder="Transaction title"

            [(ngModel)]="title"

            name="title"
        >

        <label>Category</label>

        <select

            [(ngModel)]="category"

            name="category"

            >

            <option value="">

                Select Category

            </option>

            <option

                *ngFor="
                let cat of categories
                "

                [value]="cat.name"

            >

                {{ cat.name }}

                ({{ cat.type }})

            </option>

        </select>

        <label>Amount</label>

        <input
            type="number"

            placeholder="Amount"

            [(ngModel)]="amount"

            name="amount"
        >

        <label>Type</label>

        <select

            [(ngModel)]="type"

            name="type"
            >

            <option>
                Income
            </option>

            <option>
                Expense
            </option>

        </select>

        <button
          type="submit"
          class="save-button"
        >
          Save Transaction
        </button>

      </form>

    </div>

  </div>

</div>
