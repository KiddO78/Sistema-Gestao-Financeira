<div class="login-container">

  <h1>Login</h1>

  <form (ngSubmit)="login()">

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      name="email"
    >

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
    >

    <button type="submit">
      Login
    </button>

  </form>

</div>
