<div class="register-container">

  <h1>Create Account</h1>

  <form (ngSubmit)="register()">

    <input
      type="text"
      placeholder="Name"
      [(ngModel)]="name"
      name="name"
    >

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="email"
      name="email"
    >

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
    >

    <button type="submit">
      Register
    </button>

  </form>

</div>
