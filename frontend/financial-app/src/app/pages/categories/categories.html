<app-sidebar></app-sidebar>

<div class="categories-page">

  <!-- TOPBAR -->

  <div class="topbar">

    <div>

      <h1>Categories</h1>

      <p>
        Organize your financial categories
      </p>

    </div>

  </div>

  <!-- ADD CATEGORY CARD -->

  <div class="add-category-card">

    <div class="card-header">

      <div class="header-icon">

        <i class="bi bi-tag"></i>

      </div>

      <div>

        <h2>Add Category</h2>

        <p>
          Create a new category to organize your finances
        </p>

      </div>

    </div>

    <form (ngSubmit)="addCategory()">

      <!-- NAME -->

      <div class="input-group">

        <label>Category Name</label>

        <div class="input-container">

          <i class="bi bi-tag"></i>

          <input

            type="text"

            placeholder="Enter category name"

            [(ngModel)]="name"

            name="name"

          >

        </div>

      </div>

      <!-- TYPE -->

      <div class="input-group">

        <label>Category Type</label>

        <div class="select-container">

          <span

            class="type-dot"

            [class.income-dot]="type === 'Income'"

            [class.expense-dot]="type === 'Expense'"

          ></span>

          <select

            [(ngModel)]="type"

            name="type"

          >

            <option value="Income">

              Income

            </option>

            <option value="Expense">

              Expense

            </option>

          </select>

        </div>

      </div>

      <!-- BUTTON -->

      <button

        type="submit"

        [disabled]="!name.trim()"

      >

        <i class="bi bi-plus-lg"></i>

        Add Category

      </button>

    </form>

  </div>

  <!-- CATEGORY LIST -->

  <div class="categories-grid">

    <div

      class="category-card"

      *ngFor="
        let category of categories
      "

    >

      <div class="category-icon">

        <i class="bi bi-tag-fill"></i>

      </div>

      <h3>

        {{ category.name }}

      </h3>

      <span

        class="category-type"

        [class.income]="
          category.type === 'Income'
        "

        [class.expense]="
          category.type === 'Expense'
        "

      >

        {{ category.type }}

      </span>

    </div>

  </div>

</div>
