<app-sidebar></app-sidebar>

<div class="goals-page">

  <!-- HEADER -->

  <div class="goals-header">

    <div>

      <h1>Goals</h1>

      <p>
        Track your financial goals
      </p>

    </div>

    <button

        class="new-goal-button"

        (click)="showModal = true"

        >

        <i class="bi bi-plus-lg"></i>

        New Goal

        </button>

    </div>

  <!-- GOALS LIST -->

  <div class="goals-grid">

    <div

      class="goal-card"

      *ngFor="
        let goal of goals
      "

    >

      <!-- TOP -->

        <div class="goal-top">

            <div>

                <h2>

                    {{ goal.title }}

                </h2>

                <p>

                    Deadline:
                    {{ goal.deadline }}

                </p>

            </div>

            <div class="goal-percentage">

                {{ getProgress(goal)
                | number:'1.0-0' }}%

            </div>

            <div class="goal-actions">

                <!-- EDIT -->

                <button

                    class="edit-button"

                    (click)="startEdit(goal)"

                >

                    <i class="bi bi-pencil"></i>

                </button>

                <!-- DELETE -->

                <button

                    class="delete-button"

                    (click)="deleteGoal(goal.id)"

                >

                    <i class="bi bi-trash"></i>

                </button>

            </div>

        </div>

      <!-- MONEY -->

        <div class="goal-money">

            <div

            class="edit-section"

            *ngIf="
                editingGoalId === goal.id
            "

            >

                <input

                    type="number"

                    [(ngModel)]="editAmount"

                >

                <button

                    (click)="saveEdit(goal)"

                >

                    Save

                </button>

            </div>

            <span>

            AOA {{ goal.current_amount }}

            </span>

            <span>

            / AOA {{ goal.target_amount }}

            </span>

        </div>

      <!-- BAR -->

        <div class="progress-bar">

            <div

            class="progress-fill"

            [style.width.%]="
                getProgress(goal)
            "

            ></div>

        </div>

    </div>

  </div>

  <!-- MODAL -->

    <div

    class="modal-overlay"

    *ngIf="showModal"

    >

        <div class="goal-modal">

            <!-- TOP -->

            <div class="modal-header">

            <h2>New Goal</h2>

            <button

                class="close-button"

                (click)="showModal = false"

            >

                <i class="bi bi-x-lg"></i>

            </button>

            </div>

            <!-- FORM -->

            <form (ngSubmit)="addGoal()">

            <!-- TITLE -->

            <label>Goal Name</label>

            <input

                type="text"

                placeholder="Ex: Emergency Fund"

                [(ngModel)]="title"

                name="title"

            >

            <!-- TARGET -->

            <label>Target Amount</label>

            <input

                type="number"

                placeholder="AOA 0"

                [(ngModel)]="target_amount"

                name="target_amount"

            >

            <!-- CURRENT -->

            <label>Current Amount</label>

            <input

                type="number"

                placeholder="AOA 0"

                [(ngModel)]="current_amount"

                name="current_amount"

            >

            <!-- DEADLINE -->

            <label>Deadline</label>

            <input

                type="date"

                [(ngModel)]="deadline"

                name="deadline"

                [min]="today"

            >

            <!-- ICONS -->

            <label>Icon</label>

            <div class="icon-picker">

                <div

                class="icon-option"

                *ngFor="let icon of icons"

                [class.selected-icon]="
                    selectedIcon === icon
                "

                (click)="selectedIcon = icon"

                >

                <i class="bi {{ icon }}"></i>

                </div>

            </div>

            <!-- COLORS -->

            <label>Color</label>

            <div class="color-picker">

                <div

                class="color-option"

                *ngFor="let color of colors"

                [style.background]="color"

                [class.selected-color]="
                    selectedColor === color
                "

                (click)="selectedColor = color"

                >

                </div>

            </div>

            <!-- ACTIONS -->

            <div class="modal-actions">

                <button

                type="button"

                class="cancel-button"

                (click)="showModal = false"

                >

                Cancel

                </button>

                <button

                type="submit"

                class="create-button"

                >

                Create

                </button>

            </div>

            </form>

        </div>

    </div>

</div>
